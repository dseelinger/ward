name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The names list is never in the tree. It arrives as a secret and is
      # written outside the checkout, so no careless `git add` in a later step
      # can commit the thing this whole check exists to keep out of the repo.
      #
      # Secrets are withheld from pull requests opened from a fork. Rather than
      # let check.sh silently pass with no list — it is built to fail hard in
      # exactly that case — the workflow skips the step and says so. The check
      # then runs on merge to main. That exception lives here, where it is
      # visible, instead of being smuggled into the script as a quiet pass.
      - name: Materialise the names list
        id: names
        env:
          NAMES: ${{ secrets.WARD_BANNED_NAMES }}
        run: |
          if [ -z "$NAMES" ]; then
            echo "::notice::Names list unavailable (fork pull request). This check runs on merge to main."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$NAMES" > "$RUNNER_TEMP/banned-names.txt"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: check.sh
        if: steps.names.outputs.skip == 'false'
        env:
          WARD_BANNED_NAMES: ${{ runner.temp }}/banned-names.txt
        run: sh check.sh

  # Windows, because ward talks to the Windows data protection API directly and
  # so does not compile anywhere else. Running this on Linux would not be a
  # cheaper version of the same check; it would be a different one that cannot
  # pass.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Licences are an allowlist: anything not named in deny.toml fails. This
  # reads dependency metadata rather than building, so it does not need Windows.
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
