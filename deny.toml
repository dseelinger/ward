# Dependency licenses.
#
# An allowlist, never a blocklist. A blocklist only catches the copyleft
# licenses somebody thought to name; an allowlist catches the one nobody
# thought of, which is how a copyleft codec ends up inside a shipped installer
# three levels beneath a permissively licensed package with nobody noticing.
#
# Adding a line here is a decision. It is not a step in making the build go
# green.

[graph]
# Ward is Windows-only, so only this target's dependencies are real. Resolving
# every platform would drag in crates that are never built and never shipped,
# and asking for a license decision about code that does not ship is how an
# allowlist stops meaning anything.
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[licenses]
# Anything not listed fails the build.
allow = [
    # The settled permissive set.
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    "MS-PL",

    # Equivalent in effect, and present in this tree. Each was read before
    # being added rather than pasted in to clear an error.
    "0BSD",
    "MIT-0",
    "Zlib",
    "BSL-1.0",           # clipboard-win, error-code
    "Unicode-3.0",       # unicode-ident and the ICU crates
    "CDLA-Permissive-2.0", # webpki-root-certs, the root certificate bundle

    # Font licenses, and the only entries here carrying an obligation that is
    # not satisfied by the copyright notice alone. They arrive with the UI
    # toolkit's bundled typefaces and are combined with AND, not OR, so they
    # cannot be traded away for a permissive alternative. Attribution is in
    # NOTICE.md.
    "OFL-1.1",           # epaint_default_fonts
    "Ubuntu-font-1.0",   # epaint_default_fonts
]

# Some crates offer a choice that includes a copyleft license. Taking the
# permissive side is the whole point of the choice being offered, and recording
# it here makes the decision visible rather than implicit.
[[licenses.exceptions]]
name = "self_cell" # Apache-2.0 OR GPL-2.0-only — we take Apache-2.0.
allow = ["Apache-2.0"]
