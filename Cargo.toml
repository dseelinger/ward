[package]
name = "ward"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A voice companion for Elite Dangerous."
repository = "https://github.com/dseelinger/ward"

# A workspace so the OpenVR bindings can be their own crate. They have to be:
# bindgen runs in a build script, and a build script belongs to the crate it
# builds, not to the one that uses it.
[workspace]
members = ["crates/openvr-sys"]

[dependencies]
anyhow = "1.0.104"
ash = "0.38.0"
cpal = "0.17.3"
eframe = "0.36.1"
egui = "0.36.1"
egui-wgpu = "0.36.1"
futures-util = "0.3.33"
glam = "0.33.3"
openvr-sys = { version = "0.1.0", path = "crates/openvr-sys" }
pollster = "1.0.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "http2", "default-tls"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "minimp3"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "rt"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "native-tls"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter", "registry", "time"] }
whisper-rs = { version = "0.16.0", default-features = false, features = ["tracing_backend"] }
wgpu = "30.0.0"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
# Named for what it does inside whisper-rs, not for what it sounds like. That
# crate builds its C++ one way for a debug build and another for a release one,
# and on this workload the debug configuration is eleven times faster: a two
# second clip took 2.4 seconds to transcribe one way and 25.5 the other, on the
# same machine with the same model, with a fan audible across the room.
#
# The output is identical - the end-to-end test transcribes a spoken sentence
# word for word either way - so this is speed with nothing traded for it.
#
# What in that branch does it is still not established. It changes the CMake
# configuration and defines WHISPER_DEBUG, and setting the configuration alone
# through the environment did not help, so it is not simply which optimizer
# flags are used. The flag is on because it was measured, not because the
# mechanism is understood.
whisper-rs-sys = { version = "0.15.0", features = ["force-debug"] }
