[package]
name = "ward"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A voice companion for Elite Dangerous."
repository = "https://github.com/dseelinger/ward"

# A workspace so the OpenVR bindings can be their own crate. They have to be:
# bindgen runs in a build script, and a build script belongs to the crate it
# builds, not to the one that uses it.
[workspace]
members = ["crates/openvr-sys"]

[dependencies]
anyhow = "1.0.104"
cpal = "0.17.3"
eframe = "0.36.1"
futures-util = "0.3.33"
openvr-sys = { version = "0.1.0", path = "crates/openvr-sys" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "http2", "default-tls"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "minimp3"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "rt"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "native-tls"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter", "registry", "time"] }
whisper-rs = { version = "0.16.0", default-features = false, features = ["tracing_backend"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
