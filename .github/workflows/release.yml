name: release

# What ships, and the checks that stand between a release and a Commander.
#
# The checks themselves are in `gate.yml`, which this calls. They are kept there
# rather than here so that they can be run against any branch without publishing
# anything — the alternative is a gate first exercised on the run where it
# matters, which is how one ends up silently broken.
#
# Heavy checks run on this path rather than on every push. A push cannot ship a
# broken install, so the check belongs where the shipping happens, and keeping
# the push loop quick matters more for a project with one maintainer than
# running the same twelve-minute job a hundred times a week.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Build, prove the binary is what it says it is, prove it needs nothing
  # installed alongside it, install it, launch it, watch it survive, and prove
  # an upgrade keeps the Commander's data folder.
  gate:
    uses: ./.github/workflows/gate.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ward-setup
          path: dist

      # Attached only after the gate has passed, which is what makes the gate
      # mean anything. Until this step runs there is a release with nothing
      # installable on it, and that is the correct state for a release whose
      # installer has not been proven — an update check that advertises a
      # version with no asset sends people to an empty page.
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # There is no checkout in this job, so the CLI has no repository to
          # infer from and has to be told which one it is talking about.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/ward-setup-*.exe dist/SHA256SUMS.txt --clobber
