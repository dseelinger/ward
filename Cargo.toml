[package]
name = "ward"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A voice companion for Elite Dangerous."
repository = "https://github.com/dseelinger/ward"

# A workspace so the OpenVR bindings can be their own crate. They have to be:
# bindgen runs in a build script, and a build script belongs to the crate it
# builds, not to the one that uses it.
[workspace]
members = ["crates/openvr-sys"]

[dependencies]
anyhow = "1.0.104"
ash = "0.38.0"
cpal = "0.17.3"
eframe = "0.36.1"
egui = "0.36.1"
egui-wgpu = "0.36.1"
futures-util = "0.3.33"
glam = "0.33.3"
openvr-sys = { version = "0.1.0", path = "crates/openvr-sys" }
pollster = "1.0.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "http2", "default-tls"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "minimp3"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "rt"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "native-tls"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter", "registry", "time"] }
whisper-rs = { version = "0.16.0", default-features = false, features = ["tracing_backend"] }
wgpu = "30.0.0"
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory"] }
# Ward's release builds compiled the speech model's C++ with the optimizer off,
# and this turns it back on.
#
# The cost was eleven to one: transcribing two seconds of audio took 25.5
# seconds in a release build and 2.4 in a debug one, on the same machine with
# the same model. Only the release build - so every measurement taken while
# developing looked fine, and the binary handed to somebody to try did not.
#
# How it happens. whisper-rs-sys asks the cmake crate for a Release build, and
# the cmake crate then passes CMake its own compiler flags for that
# configuration. Those flags *replace* the ones CMake had rather than adding to
# them, and they contain no /O at all - so the Release configuration compiles
# with optimization disabled. A debug build takes the other branch of that
# script, lands on a different configuration, and keeps its optimizer flags,
# which is why the fast build was the one nobody was worried about.
#
# Why this feature rather than the flags directly. Setting the flags needs an
# environment variable at build time, and cargo's own `[env]` table does not
# reach a dependency's build script - so it would have to be remembered by
# every build, everywhere, forever. This is one line that always applies.
# The name is the crate's, and means "use the configuration a debug build uses",
# which on this workload is the optimized one.
#
# Nothing is traded for it: the end-to-end test speaks a sentence and
# transcribes it back word for word, and passes either way.
whisper-rs-sys = { version = "0.15.0", features = ["force-debug"] }
