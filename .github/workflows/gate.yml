name: gate

# Everything heavy, in one place that can be run on its own.
#
# These checks used to live inside the release workflow, which meant the only
# way to exercise them was to publish something. That is the wrong way round for
# the one gate whose whole job is to stop a broken release: it was first run on
# the run where it mattered, which is how an install gate ends up silently
# broken and nobody finds out until somebody's settings disappear.
#
# So it lives here, the release workflow calls it, and it can be started by hand
# against any branch without publishing anything at all.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      break:
        description: >
          Deliberately break one check, to prove this gate can fail. Never used
          by the release path.
        type: choice
        default: nothing
        options:
          - nothing
          - the version assertion
          - the upgrade check

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Its own cache, separate from the one every push uses. This job builds
      # against a different C runtime, so it shares no compiled artifact with
      # that one - and pointing both at the same cache means each run throws
      # away what the other put there and rebuilds three hundred crates and the
      # speech model's C++ from nothing.
      #
      # Saved even when the job fails, because the runs worth caching hardest
      # are the ones being iterated on.
      # The key names the C runtime settings on purpose, and has to be changed
      # whenever they are.
      #
      # What is cached includes the speech model's C++ build directory, and
      # CMake keeps its configuration in there. The build script does not rerun
      # when one of those variables changes, so a run that restores this cache
      # builds the C++ the way the last run configured it and ignores the
      # settings entirely. The failure looks exactly like the settings not
      # working, which is how an hour goes into the wrong question - and it
      # happened twice on the way here, once locally and once in this workflow.
      - uses: Swatinem/rust-cache@v2
        with:
          key: static-crt-MultiThreaded-cmp0091-new
          cache-on-failure: true

      - name: What version is this
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)

          if [ "${{ inputs.break }}" = "the version assertion" ]; then
            version="0.0.0-deliberately-wrong"
            echo "::warning::Breaking the version assertion on purpose."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Expecting Ward $version"

      # Static C runtime, so the binary is one file that needs nothing
      # installed alongside it.
      #
      # Set here rather than in a config file that every build would pick up,
      # because the debug profile does not link this way — the C++ compiled for
      # the speech model and Rust's own code end up disagreeing about which C
      # runtime they are using. What ships is what has to be self-contained, so
      # this is on the path that ships and the step below proves it worked.
      #
      # Both halves are required and they have to agree. Rust goes static
      # through the target feature; the C++ compiled during the build goes
      # static through CMake's runtime setting.
      - name: Build, linking the C runtime in
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
          # Without this the line above does nothing at all.
          #
          # Choosing the C runtime through that variable is behavior CMake
          # gates behind a policy, and a project declaring an older minimum
          # gets the old behavior - which is to ignore the variable silently
          # and use the dynamic runtime. Nothing warns. The build succeeds and
          # the link fails afterwards with fifteen unresolved symbols, all of
          # them prefixed to say they wanted a DLL.
          #
          # The two settings are one setting. Neither is any use alone, and the
          # one that looks like it is doing the work is the one that does
          # nothing without the other.
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
        run: cargo build --release

      # The binary is asked what it is rather than trusted to be what the build
      # thought it was. This is the whole point of the flag existing.
      - name: The binary reports the version it was built as
        shell: bash
        run: |
          reported=$(./target/release/ward.exe --version)
          expected="Ward ${{ steps.version.outputs.version }}"
          echo "reported: $reported"
          [ "$reported" = "$expected" ] || { echo "expected: $expected"; exit 1; }

      # The claim NOTICE.md makes, checked rather than asserted. A binary that
      # imports the Visual C++ runtime does not run on a machine that has never
      # had a C++ application installed, and that is exactly the machine this
      # whole job is about.
      - name: Nothing has to be installed alongside it
        shell: pwsh
        run: |
          # Read in process rather than shelling out. An external search sets
          # the last exit code to "no match", the step wrapper reads that as the
          # step's own result, and a check that passed reports failure.
          $bytes = [System.IO.File]::ReadAllBytes("target\release\ward.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)

          foreach ($dll in @("VCRUNTIME140", "MSVCP140")) {
            if ($text.Contains($dll)) {
              Write-Error "ward.exe imports $dll, so it needs the Visual C++ redistributable"
              exit 1
            }
          }

          Write-Host "No Visual C++ runtime dependency."

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\ward.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist

      # Published with the release and verified before anything downloaded is
      # executed. Ward ships unsigned, and this is what stands in for a
      # certificate on the one risk that matters — a file that is not the file
      # the release meant to publish.
      - name: Checksum
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\ward-setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      # The closes-when, run on a machine that has genuinely never seen Ward.
      #
      # The pre-check is not ceremony. If a Ward were somehow already running,
      # a single-instance guard could make a launch that did nothing look like
      # a launch that worked, and this test would pass while proving the
      # opposite of what it claims.
      - name: Install it, run it, and see whether it survives
        shell: pwsh
        run: |
          if (Get-Process ward -ErrorAction SilentlyContinue) {
            Write-Error "Ward was already running before the install. This test cannot mean anything."
            exit 1
          }

          $setup = Get-ChildItem dist\ward-setup-*.exe | Select-Object -First 1
          $installed = "$env:LOCALAPPDATA\Programs\Ward\ward.exe"

          if (Test-Path $installed) {
            Write-Error "Ward is already installed on this runner. This test cannot mean anything."
            exit 1
          }

          Start-Process -FilePath $setup.FullName `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait

          if (-not (Test-Path $installed)) {
            Write-Error "The installer ran and put no executable down."
            exit 1
          }

          # No elevation was asked for, so it must have landed in the per-user
          # location rather than under Program Files.
          Write-Host "Installed to $installed"

          # Redirected to a file rather than captured from a pipe. A released
          # build is a windowed program: run without redirection it has no
          # usable stdout at all, and what comes back is empty.
          $said = Join-Path $env:RUNNER_TEMP "installed-version.txt"
          Start-Process -FilePath $installed -ArgumentList "--version" `
            -Wait -NoNewWindow -RedirectStandardOutput $said

          $reported = (Get-Content $said -Raw).Trim()
          Write-Host "installed binary reports: $reported"
          if ($reported -ne "Ward ${{ steps.version.outputs.version }}") {
            Write-Error "The installed binary is not the one that was built."
            exit 1
          }

          $ward = Start-Process -FilePath $installed -PassThru
          Start-Sleep -Seconds 20

          if ($ward.HasExited) {
            Write-Error "Ward started and then stopped. Exit code $($ward.ExitCode)."
            Get-Content "$env:LOCALAPPDATA\Programs\Ward\data\logs\*.log" -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Host "Still running after 20 seconds."
          Stop-Process -Id $ward.Id -Force

      # Everything the Commander owns lives in one folder beside the program:
      # their settings, their checklist, their encrypted key, their logs. An
      # upgrade replaces the program and must not touch it.
      #
      # This is the check that could not exist before, because a branch build
      # cannot be installed over an existing install and so a manual pass never
      # tested an upgrade at all. It runs immediately after the install above,
      # over the install the step above just made, which is the real mechanism
      # rather than a fabricated folder that resembles one.
      #
      # A marker with contents rather than an empty file, because a preserved
      # path with a replaced file is the more likely failure and an existence
      # check would call it a pass.
      - name: An upgrade keeps what the Commander owns
        shell: pwsh
        run: |
          $home_dir = "$env:LOCALAPPDATA\Programs\Ward"
          $data = Join-Path $home_dir "data"
          $marker = Join-Path $data "settings.json"
          $written = '{"voice":"the one they chose"}'

          New-Item -ItemType Directory -Force -Path $data | Out-Null
          Set-Content -Path $marker -Value $written -Encoding ascii -NoNewline

          if ("${{ inputs.break }}" -eq "the upgrade check") {
            Write-Warning "Deleting the data folder on purpose, to prove this check fails."
            Remove-Item -Recurse -Force $data
          }

          $setup = Get-ChildItem dist\ward-setup-*.exe | Select-Object -First 1

          Start-Process -FilePath $setup.FullName `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait

          if (-not (Test-Path $marker)) {
            Write-Error "The upgrade removed the Commander's data folder."
            exit 1
          }

          $after = Get-Content $marker -Raw
          if ($after -ne $written) {
            Write-Error "The upgrade overwrote settings.json. Before: $written After: $after"
            exit 1
          }

          Write-Host "Settings survived the upgrade unchanged."

      - uses: actions/upload-artifact@v4
        with:
          name: ward-setup
          path: |
            dist/ward-setup-*.exe
            dist/SHA256SUMS.txt
